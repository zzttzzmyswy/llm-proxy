name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" \
            -o "llm-proxy-linux-${{ matrix.goarch }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-proxy-linux-${{ matrix.goarch }}
          path: llm-proxy-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          cd artifacts
          cp llm-proxy-linux-amd64/llm-proxy-linux-amd64 .
          cp llm-proxy-linux-arm64/llm-proxy-linux-arm64 .
          cd ..
          sha256sum artifacts/llm-proxy-linux-* > artifacts/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/llm-proxy-linux-amd64
            artifacts/llm-proxy-linux-arm64
            artifacts/SHA256SUMS
          generate_release_notes: true
