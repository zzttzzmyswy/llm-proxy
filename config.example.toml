# Example main configuration for llm-proxy.
#
# Copy to /etc/llm-proxy/config.toml (or point LLM_PROXY_CONFIG at it), then write
# at least one scheme file under ./schemes/ next to it.
#
# There are NO global upstream or VLM settings. Everything about reaching a model
# lives in a scheme file, and exactly one scheme is active at a time — see
# schemes.example/ for complete examples.

[proxy]
port = 8088

# The active scheme: the file name (without .toml) under the schemes directory.
# Switching providers is switching this value, never editing shared globals.
scheme = "dso"

# Optional. Defaults to $LLM_PROXY_SCHEMES_DIR, else a "schemes" directory next to
# this file.
# schemes_dir = "/etc/llm-proxy/schemes"

[admin]
# Web admin page password (HTTP Basic, username arbitrary). Page address is
# http://<host>:<port>/admin — it edits the active scheme and shows per-model
# traffic. Empty = the whole /admin subtree returns 404 (fail closed): the proxy
# listens on a routable address, so an anonymous config editor would expose the
# upstream keys and routing table to the network.
# LLM_PROXY_ADMIN_TOKEN overrides this value.
token = ""

# Environment variables a scheme can reference instead of storing a secret:
#   LLM_PROXY_CONFIG        path to this file
#   LLM_PROXY_SCHEMES_DIR   directory holding the scheme files
#   LLM_PROXY_ADMIN_TOKEN   admin page password
#   <anything>              any upstream's key_env, e.g. DEEPSEEK_API_KEY
#
# SOPHNET_API_KEY is no longer read: every upstream authenticates with its own
# key or key_env.
