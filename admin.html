<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-proxy 管理页面</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #1c2024;
    --muted: #6b7280;
    --accent: #2563eb;
    --ok: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --bar: #93c5fd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 48px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 24px; }
  section > h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfc; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #eef2f7; color: var(--muted); font-size: 12px; }
  .scroll { overflow-x: auto; }
  button {
    font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: #c3c9d1; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password], select {
    font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--text); width: 100%;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .grid.wide { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .form-body { padding: 16px; }
  .form-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .route-row { display: grid; grid-template-columns: 1.2fr 1.6fr 1fr auto auto auto; gap: 10px; align-items: end; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .route-row:last-child { border-bottom: none; }
  .route-row input[type=checkbox] { width: auto; }
  .chk { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; font-size: 13px; }
  .chk label { margin: 0; color: var(--text); }
  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; display: none; white-space: pre-wrap; }
  .banner.show { display: block; }
  .banner .close { float: right; border: none; background: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 0 0 10px; color: inherit; }
  .banner.err { background: #fef2f2; border: 1px solid #fecaca; color: var(--bad); }
  .banner.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--ok); }
  .banner.warnbox { background: #fffbeb; border: 1px solid #fde68a; color: var(--warn); }
  .empty { padding: 20px 16px; color: var(--muted); }
  .spark { display: block; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend { font-size: 12px; color: var(--muted); margin-left: auto; }

  /* ---- history chart ---- */
  .chart-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .chip {
    font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer;
  }
  .chip:hover { border-color: #c3c9d1; color: var(--text); }
  .chip.on { border-color: var(--accent); background: #eff6ff; color: var(--accent); }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .sep { width: 1px; height: 18px; background: var(--border); }
  .chart-wrap { padding: 8px 12px 0; }
  svg.chart { display: block; width: 100%; height: 240px; overflow: visible; }
  svg.chart .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  svg.chart .cursor { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; }
  svg.chart path { vector-effect: non-scaling-stroke; }
  svg.chart text.axis { fill: var(--muted); font-size: 11px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 0; }
  .tip {
    position: fixed; z-index: 30; display: none; pointer-events: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12); min-width: 170px;
  }
  .tip.show { display: block; }
  .tip .tip-time { color: var(--muted); margin-bottom: 6px; }
  .tip .tip-row { display: flex; justify-content: space-between; gap: 16px; }
  .tip .tip-total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; font-weight: 600; }
  .tip .tip-unit { color: var(--muted); margin-top: 4px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1>llm-proxy 管理页面</h1>
  <span class="meta" id="head-meta">加载中…</span>
  <span class="spacer"></span>
  <span class="legend" id="refresh-legend"></span>
  <button id="btn-refresh">立即刷新</button>
  <button id="btn-auto">暂停自动刷新</button>
  <button id="btn-reset" class="danger">清零统计</button>
</header>

<main>
  <div id="banner" class="banner"></div>

  <section>
    <h2>总览</h2>
    <div class="cards" id="totals"></div>
  </section>
  <section>
    <h2>历史速率</h2>
    <div class="panel">
      <div class="chart-head" id="history-controls"></div>
      <div class="chart-wrap"><div id="history-chart"></div></div>
      <div id="history-summary"></div>
      <div class="hint" id="history-meta" style="padding:0 16px 12px; margin:0"></div>
    </div>
  </section>

  <section>
    <h2>模型调用情况</h2>
    <div class="panel scroll" id="models"></div>
  </section>

  <section>
    <h2>失败情况</h2>
    <div class="panel scroll" id="failures"></div>
  </section>

  <section>
    <h2>配置</h2>
    <div id="save-banner" class="banner"></div>
    <div class="panel">
      <div class="form-body">
        <div class="grid">
          <div><label>监听端口</label><input type="number" id="cfg-port" min="1" max="65535"></div>
          <div><label>VLM 模型（图片描述）</label><input type="text" id="cfg-vlm-model"></div>
          <div><label>VLM 最大输出 token</label><input type="number" id="cfg-vlm-max-tokens" min="0"></div>
        </div>
      </div>
      <div class="form-body" style="border-top:1px solid var(--border)">
        <div class="grid wide">
          <div><label>Anthropic 上游地址</label><input type="text" id="cfg-anthropic-url"></div>
          <div><label>OpenAI 上游地址</label><input type="text" id="cfg-openai-url"></div>
          <div>
            <label>默认网关</label>
            <select id="cfg-default-upstream">
              <option value="">Anthropic（默认）</option>
              <option value="openai">OpenAI（协议自动翻译）</option>
            </select>
          </div>
          <div><label>响应头超时（秒）</label><input type="number" id="cfg-header-timeout" min="0"></div>
          <div><label>响应体静默上限（秒）</label><input type="number" id="cfg-body-idle" min="0"></div>
          <div><label>瞬态重试次数</label><input type="number" id="cfg-max-retries" min="0"></div>
        </div>
      </div>
      <div class="form-body" style="border-top:1px solid var(--border)">
        <div class="grid">
          <div>
            <label>上游密钥</label>
            <input type="password" id="cfg-sophnet" placeholder="留空则保持原密钥不变" autocomplete="new-password">
            <div class="hint" id="cfg-key-hint"></div>
          </div>
          <div class="chk"><input type="checkbox" id="cfg-key-clear"><label for="cfg-key-clear">清除已保存的密钥</label></div>
        </div>
      </div>
      <div class="form-body" style="border-top:1px solid var(--border)">
        <div class="grid">
          <div>
            <label>管理页面口令</label>
            <input type="password" id="cfg-admin-token" placeholder="留空则保持原口令不变" autocomplete="new-password">
            <div class="hint" id="cfg-admin-hint"></div>
          </div>
          <div class="chk"><input type="checkbox" id="cfg-admin-clear"><label for="cfg-admin-clear">清除口令（关闭管理页面）</label></div>
        </div>
      </div>
      <div style="border-top:1px solid var(--border)">
        <div class="form-body" style="padding-bottom:8px; display:flex; align-items:center;">
          <strong style="font-size:13px">模型路由表</strong>
          <span class="hint" style="margin:0 0 0 10px">别名即 Claude Code 请求的模型名；supports_image 表示该上游模型原生支持图片，跳过 VLM 描述。</span>
        </div>
        <div id="routes"></div>
        <div class="form-body" style="border-top:1px solid var(--border)">
          <button id="btn-add-route">添加路由</button>
        </div>
        <div class="form-body" style="border-top:1px solid var(--border)">
          <label style="margin-bottom:6px">生效路由（只读）</label>
          <div class="hint" style="margin:0 0 8px">经过默认网关与内置兜底之后，每个别名实际走哪个模型。这里的内容不会被保存。</div>
          <div id="effective-routes"></div>
        </div>
      </div>
      <div class="form-actions">
        <button class="primary" id="btn-save">保存配置</button>
        <button id="btn-reload">放弃修改</button>
        <span class="hint" id="save-hint" style="margin:0"></span>
      </div>
    </div>
    <div class="hint">保存会先备份为 <code>&lt;配置文件&gt;.bak.&lt;时间戳&gt;</code>，再原子写入并立即生效（端口变更除外，需重启服务）。</div>
  </section>
</main>

<div class="tip" id="history-tip" role="tooltip"></div>

<script>
/*__ADMIN_JS__*/
</script>
</body>
</html>
